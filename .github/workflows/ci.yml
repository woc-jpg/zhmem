name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest
      - name: Retrieval metrics
        run: python -m zhmem.eval
      - name: Ablation table
        run: python -m bench.ablation
      - name: CLI smoke test (offline, no network)
        run: |
          python -m zhmem stats
          python -m zhmem ask "深蹲怎么做才标准" --offline --no-images
