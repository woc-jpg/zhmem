[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhmem"
version = "0.2.0"
description = "Chinese-first hybrid information retrieval: FTS5 + coverage memory recall, built-in life/travel/fitness knowledge, web and image search"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "YG" }]
keywords = ["chinese", "retrieval", "fts5", "sqlite", "search", "memory", "rag"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Indexing",
  "Natural Language :: Chinese (Simplified)",
]
dependencies = []

[project.optional-dependencies]
vector = ["numpy>=1.24"]
mcp = ["mcp>=1.0,<3"]
gui = ["Pillow>=9"]          # 只有缩略图需要；不装就用链接代替图片
dev = ["pytest>=8", "numpy>=1.24", "mcp>=1.0,<3", "Pillow>=9"]

[project.urls]
Homepage = "https://github.com/woc-jpg/zhmem"
Repository = "https://github.com/woc-jpg/zhmem"
Issues = "https://github.com/woc-jpg/zhmem/issues"

[project.scripts]
zhmem = "zhmem.cli:main"
zhmem-mcp = "zhmem.mcp_server:main"
zhmem-gui = "zhmem.gui:main"

[tool.setuptools.packages.find]
include = ["zhmem*"]

[tool.setuptools.package-data]
"zhmem.kb" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:pytest_asyncio.*:"]
